  <text x="1030" y="345" fill="#fafafa" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">High Card</text>
  <text x="250" y="575" fill="#fafafa" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Dice Duel</text>
  <text x="640" y="575" fill="#fafafa" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Memory Match</text>
  <text x="640" y="740" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Hub cards route into dedicated game screens</text>
