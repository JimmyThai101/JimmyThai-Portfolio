<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="Arcade Lounge hub layout">
  <rect width="1280" height="800" fill="#0a0a0a"/>
  <rect x="0" y="0" width="1280" height="220" fill="url(#hubGlow)"/>
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#c41e3a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="520" y="70" width="240" height="28" rx="14" fill="#1c1c1c" stroke="#d4af37" stroke-opacity="0.4"/>
  <text x="640" y="90" fill="#d4af37" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="3">ARCADE LOUNGE</text>
  <text x="640" y="145" fill="#fafafa" font-family="Georgia, serif" font-size="36" font-weight="700" text-anchor="middle">Game Hub</text>
  <rect x="80" y="240" width="340" height="200" rx="16" fill="#1c1c1c" stroke="#c41e3a" stroke-opacity="0.4"/>
  <rect x="470" y="240" width="340" height="200" rx="16" fill="#1c1c1c" stroke="#d4af37" stroke-opacity="0.4"/>
  <rect x="860" y="240" width="340" height="200" rx="16" fill="#1c1c1c" stroke="#c41e3a" stroke-opacity="0.4"/>
  <rect x="80" y="470" width="340" height="200" rx="16" fill="#1c1c1c" stroke="#2ecc71" stroke-opacity="0.4"/>
  <rect x="470" y="470" width="340" height="200" rx="16" fill="#1c1c1c" stroke="#d4af37" stroke-opacity="0.4"/>
  <text x="250" y="345" fill="#fafafa" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Make 21</text>
